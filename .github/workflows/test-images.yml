name: "Test Images"
on:
    push:
        branches:
            - "master"
        paths:
            - ".github/workflows/test-images.yml"
            - "images/**"
            - "features/**/devcontainer-feature.json"
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - image: flutter
                    - image: go
                    - image: go-and-node
                    - image: unidbg
                    - image: web3-dev
                    - image: ultralytics
                      large: true
                    - image: cuda
                      large: true
                    - image: pyinfra
                    - image: haskell
        steps:
            - name: prepare 1000:1000
              run: |
                  set -x
                  cat /etc/group
                  cat /etc/passwd
                  id
                  sudo id

            - uses: actions/checkout@v4

            - uses: AdityaGarg8/remove-unwanted-software@3ccb44bee98b5232ab087e2bb23a5d8b14043223
              if: matrix.large
              with:
                  remove-dotnet: "true"
                  remove-android: "true"
                  remove-haskell: "true"
                  remove-codeql: "true"
                  remove-docker-images: "false"
                  remove-large-packages: "false"
                  remove-cached-tools: "true"
                  remove-swapfile: "false"

            - name: prepare for tests
              run: |
                  cd features
                  bash prepare-for-tests.sh

            - name: "Install latest devcontainer CLI"
              run: sudo npm install --ignore-scripts -g @devcontainers/cli

            - name: "Generating tests for '${{ matrix.image }}'"
              run: |
                  cd images/src/${{ matrix.image }}
                  sudo devcontainer build --workspace-folder . --image-name ${{ matrix.image }}
