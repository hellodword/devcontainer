name: "Test Features"
on:
    push:
        branches:
            - "master"
        paths:
            - ".github/workflows/test-features.yml"
            - "features/**"
    workflow_dispatch:

jobs:
    test-autogenerated:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - baseImage: mcr.microsoft.com/devcontainers/base:debian-12
                      feature: common
                    - baseImage: mcr.microsoft.com/devcontainers/base:debian-12
                      feature: common-gui
                    - baseImage: mcr.microsoft.com/devcontainers/base:debian-12
                      feature: chromium
                    - baseImage: mcr.microsoft.com/devcontainers/base:debian-12
                      feature: cloudflared
                    - baseImage: mcr.microsoft.com/devcontainers/base:debian-12
                      feature: k6
                    - baseImage: mcr.microsoft.com/devcontainers/base:debian-12
                      feature: nginx
                    - baseImage: mcr.microsoft.com/devcontainers/base:debian-12
                      feature: zig
                    - baseImage: mcr.microsoft.com/devcontainers/base:debian-12
                      feature: solana
        steps:
            - name: prepare 1000:1000
              run: |
                  set -x
                  cat /etc/group
                  cat /etc/passwd
                  id
                  sudo id

            - uses: actions/checkout@v4

            - name: prepare for tests
              run: |
                  cd features
                  bash prepare-for-tests.sh

            - name: "Install latest devcontainer CLI"
              run: sudo npm install --ignore-scripts -g @devcontainers/cli

            - name: "Generating tests for '${{ matrix.feature }}' against '${{ matrix.baseImage }}'"
              run: |
                  cd features
                  sudo devcontainer features test --skip-scenarios -f ${{ matrix.feature }} -i ${{ matrix.baseImage }} -u vscode .

    test-scenarios:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - feature: android-sdk
                    - feature: flutter
                    - feature: vala
                    - feature: maven-dep
                    - feature: pip-dep
                    - feature: cuda
        steps:
            - name: prepare 1000:1000
              run: |
                  set -x
                  cat /etc/group
                  cat /etc/passwd
                  id
                  sudo id

            - uses: actions/checkout@v4

            - name: prepare for tests
              run: |
                  cd features
                  bash prepare-for-tests.sh

            - name: "Install latest devcontainer CLI"
              run: sudo npm install --ignore-scripts -g @devcontainers/cli

            - name: "Generating tests for '${{ matrix.feature }}' scenarios"
              run: |
                  cd features
                  sudo devcontainer features test -f ${{ matrix.feature }} --skip-autogenerated --skip-duplicated -u vscode .
